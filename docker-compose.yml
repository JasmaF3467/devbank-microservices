version: "3.8"

services:
  backend:
    build: ./backend
    container_name: devbank-backend
    ports:
      - "4000:4000"
    networks:
      - devbank-net

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:4000
    container_name: devbank-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - devbank-net

networks:
  devbank-net:
    driver: bridge
